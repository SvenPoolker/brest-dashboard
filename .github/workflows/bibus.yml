name: Refresh Bibus timetable

on:
  schedule:
    - cron: "17 3 * * *"   # every night around 4-5h Brest time
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bibus.json
        run: python scripts/build_bibus.py bibus.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibus.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh Bibus timetable"
          git push
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
